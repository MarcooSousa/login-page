<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Entrar</h1>
    <p class="subtitle">
      Entre na sua conta e continue gerenciando seus projetos, ideias e progresso exatamente de onde parou.
    </p>

    <form id="login-form" novalidate>
      <div class="field" data-field="email">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3" />
          <path d="m4 8 8 6 8-6" />
        </svg>
        <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required />
      </div>
      <p class="error" id="email-error" role="alert"></p>

      <div class="field" data-field="password">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="3" />
          <path d="M8 10V8a4 4 0 0 1 8 0v2" />
        </svg>
        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required />
        <button type="button" class="toggle" id="toggle-password" aria-label="Mostrar senha">
          <svg id="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18" />
            <path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.500 4 9.500 6a14 14 0 0 1-2.600 3.300M6.600 7.600A14.500 14.500 0 0 0 2.500 12c1 2 4.500 6 9.500 6 1.600 0 3-.4 4.200-1" />
            <path d="M9.900 9.900a3 3 0 0 0 4.200 4.200" />
          </svg>
          <svg id="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M2.500 12C3.500 10 7 6 12 6s8.500 4 9.500 6c-1 2-4.500 6-9.500 6S3.500 14 2.500 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
      <p class="error" id="password-error" role="alert"></p>

      <button type="submit" class="btn-primary" id="submit">Entrar</button>
      <p class="form-message" id="form-message" role="status"></p>
    </form>

    <div class="socials">
      <button type="button" class="btn-social">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.500 21v-8h2.700l.4-3.200h-3.100V7.800c0-.9.300-1.500 1.600-1.500h1.700V3.400c-.3 0-1.300-.1-2.400-.1-2.400 0-4 1.400-4 4.100v2.400H7.700V13h2.700v8h3.100Z"/></svg>
        Facebook
      </button>
      <button type="button" class="btn-social">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><text x="12" y="16.500" text-anchor="middle" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, sans-serif" fill="#111">G</text></svg>
        Google
      </button>
      <button type="button" class="btn-social">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.960-1.040-2.040.027-3.910 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.090 1.013 1.454 2.208 3.090 3.792 3.039 1.520-.065 2.090-.987 3.935-.987 1.831 0 2.350.987 3.960.948 1.637-.026 2.676-1.480 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.220-4.857-.026-3.040 2.480-4.494 2.597-4.559-1.429-2.090-3.623-2.324-4.390-2.376-2-.156-3.675 1.090-4.610 1.090ZM15.530 3.830c.843-1.012 1.400-2.427 1.245-3.830-1.207.052-2.662.805-3.532 1.818-.780.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701Z"/></svg>
        Apple
      </button>
    </div>

    <p class="signup">Não tem uma conta? <a href="#">Cadastre-se</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
